<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Happy Independence Day</title>

    <link rel="stylesheet" href="flage.css">
</head>

<body>

    <!-- Sky -->
    <div class="sky">

        <!-- Clouds -->
        <div class="cloud cloud1">☁️</div>
        <div class="cloud cloud2">☁️</div>
        <div class="cloud cloud3">☁️</div>

        <!-- Birds -->
        <div class="bird bird1">🕊️</div>
        <div class="bird bird2">🕊️</div>
        <div class="bird bird3">🕊️</div>


        <!-- Main Content -->
        <div class="container">

            <h1> Happy Independence Day </h1>

            <p class="subtitle">
                Celebrating the Spirit of Freedom
            </p>


            <!-- Flag -->
            <div class="flag">

                <div class="orange"></div>

                <div class="white">
                    <img src="ashoka-chakra-svgrepo-com.svg"
                        class="chakra">
                </div>

                <div class="green"></div>

            </div>


            <h2>15 August 2026</h2>


            <!-- Countdown -->
            <div class="countdown">

                <div>
                    <span id="days">00</span>
                    <small>Days</small>
                </div>

                <div>
                    <span id="hours">00</span>
                    <small>Hours</small>
                </div>

                <div>
                    <span id="minutes">00</span>
                    <small>Minutes</small>
                </div>

                <div>
                    <span id="seconds">00</span>
                    <small>Seconds</small>
                </div>

            </div>


            <!-- Button -->
            <button id="celebrateBtn">
                🎉 Celebrate 🇮🇳
            </button>


            <p id="message"></p>

        </div>


        <!-- Confetti -->
        <div id="confetti"></div>

    </div>


    <script src="flage.js"></script>

</body>

</html>
